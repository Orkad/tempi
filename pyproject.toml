[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tempi"
version = "1.0.0"
description = "Enregistrement et visualisation de l'évolution de la température d'un capteur DS18B20 sur Raspberry Pi"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Aucune dépendance externe : uniquement la bibliothèque standard, pour qu'une
# installation sur Raspberry Pi ne nécessite ni compilation ni accès réseau.
dependencies = []
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: System :: Monitoring",
]

[project.scripts]
tempi = "tempi.cli:main"

[tool.setuptools]
packages = ["tempi"]

[tool.setuptools.package-data]
tempi = ["static/*.html"]
