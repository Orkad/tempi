<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tempi — températures</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #dfe3e8;
    --text: #1b1f24;
    --muted: #616a75;
    --accent: #2f6fd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --panel: #1c2027;
      --border: #2c323b;
      --text: #e8eaed;
      --muted: #9aa4b0;
      --accent: #6ea8fe;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.25rem;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: .75rem; margin-bottom: 1rem; }
  h1 { font-size: 1.25rem; margin: 0; }
  .status { color: var(--muted); font-size: .85rem; }
  .status.error { color: #d0342c; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .cards { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1rem; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--dot, var(--accent));
    border-radius: 10px;
    padding: .7rem .95rem;
    min-width: 11rem;
  }
  .card .name { font-size: .8rem; color: var(--muted); cursor: pointer; }
  .card .name:hover { text-decoration: underline; }
  .card .value { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .card .age { font-size: .75rem; color: var(--muted); }
  .card.stale { opacity: .55; }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .75rem; }
  #ranges { display: flex; flex-wrap: wrap; gap: .4rem; }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: .3rem .7rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #ranges button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .spacer { flex: 1; }
  a { color: var(--accent); }
  /* Le graphique est un appareil de mesure : il garde son fond profond dans les
     deux thèmes, pour que les tracés restent lisibles de loin — le Raspberry Pi
     et son écran sont rarement dans les mêmes conditions d'éclairage que le
     poste depuis lequel on consulte l'interface. Les couleurs du tracé ne
     dépendent donc pas du thème et sont déclarées ici une seule fois. */
  .plot {
    --plot-bg: #10141a;
    --plot-grid: #1c232c;
    --plot-axis: #8b95a2;
    --plot-rule: #2b333d;
    --plot-ink: #dfe5ec;
    background: var(--plot-bg);
    border-radius: 8px;
    padding: .5rem .6rem .35rem;
  }
  .legend { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: .35rem; font-size: .85rem; }
  .legend button { display: flex; align-items: center; gap: .4rem; border: none; background: none; color: var(--plot-ink); padding: .15rem .3rem; }
  .legend .swatch { width: .75rem; height: .75rem; border-radius: 3px; }
  .legend button[aria-pressed="false"] { opacity: .4; }
  #chart { width: 100%; height: 380px; display: block; touch-action: none; }
  .axis {
    fill: var(--plot-axis);
    font-size: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .axis-value { fill: var(--plot-ink); font-weight: 600; }
  .gridline { stroke: var(--plot-grid); stroke-width: 1; stroke-dasharray: 1 5; stroke-linecap: round; }
  .baseline { stroke: var(--plot-rule); stroke-width: 1; }
  .cursor { stroke: var(--plot-axis); stroke-opacity: .5; stroke-dasharray: 3 3; }
  /* Le cerne à la couleur du fond détache le point de la courbe qu'il marque. */
  .endpoint { stroke: var(--plot-bg); stroke-width: 2; }
  .empty-note { fill: var(--plot-axis); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 3rem 1rem; }
  /* La table à six colonnes est plus large qu'un écran de téléphone. Elle défile
     dans son propre conteneur : sans cela, elle élargit tout le document et
     rogne l'en-tête, les cartes et le graphique. */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; min-width: 24rem; }
  th, td { text-align: right; padding: .4rem .5rem; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  td { font-variant-numeric: tabular-nums; }
  .tip {
    position: fixed; pointer-events: none; z-index: 10;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: .5rem .65rem; font-size: .82rem; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    opacity: 0; transition: opacity .1s;
  }
  .tip .t { color: var(--muted); margin-bottom: .25rem; }
  .tip .row { display: flex; align-items: center; gap: .4rem; }
  .tip .swatch { width: .6rem; height: .6rem; border-radius: 2px; }

  @media (max-width: 480px) {
    body { padding: .75rem; }
    h1 { font-size: 1.1rem; }
    /* Deux cartes par ligne plutôt qu'une largeur fixe qui déborde. */
    .card { min-width: 0; flex: 1 1 8.5rem; padding: .6rem .75rem; }
    .card .value { font-size: 1.35rem; }
    .panel { padding: .75rem; }
    #chart { height: 300px; }
    /* Sans l'espaceur, « Rafraîchir » et l'export se replient à gauche
       au lieu d'être poussés hors de l'écran. */
    .controls .spacer { display: none; }
    th, td { padding: .35rem .4rem; }
    /* Le nombre de mesures est la colonne la moins décisive : la masquer permet
       aux cinq autres de tenir sans défilement. La donnée reste dans l'API et
       dans l'export CSV. */
    th:nth-child(6), td:nth-child(6) { display: none; }
    table { min-width: 0; font-size: .82rem; }
  }
</style>
</head>
<body>
<header>
  <h1>tempi</h1>
  <span class="status" id="status">chargement…</span>
</header>

<div class="cards" id="cards"></div>

<div class="panel">
  <div class="controls">
    <div id="ranges"></div>
    <div class="spacer"></div>
    <button id="refresh" title="Rafraîchir maintenant">Rafraîchir</button>
    <a id="csv" href="#" download>Export CSV</a>
  </div>
  <div class="plot">
    <svg id="chart" role="img" aria-label="Évolution de la température"></svg>
    <div class="legend" id="legend"></div>
  </div>
</div>

<div class="panel">
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Capteur</th><th>Min</th><th>Moy.</th><th>Max</th><th>Amplitude</th><th>Mesures</th></tr>
      </thead>
      <tbody id="summary"></tbody>
    </table>
  </div>
</div>

<div class="tip" id="tip"></div>

<script>
"use strict";

/**
 * Teintes calibrées pour le fond profond du graphique : chacune tient au moins
 * 3:1 de contraste dessus, et deux teintes voisines restent distinguables en
 * vision déficiente (écart minimal de 8,4 en protanopie). L'ordre compte : il a
 * été retenu parce que ce sont les couples consécutifs, ceux que l'on compare le
 * plus souvent, qui doivent le mieux se séparer.
 */
const PALETTE = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"];
const RANGES = [
  { key: "1h",  label: "1 h"    },
  { key: "6h",  label: "6 h"    },
  { key: "12h", label: "12 h"   },
  { key: "24h", label: "24 h",  default: true },
  { key: "7d",  label: "7 j"    },
  { key: "30d", label: "30 j"   },
  { key: "all", label: "Tout"   },
];

/** L'URL prime sur la dernière plage consultée, pour que les liens soient partageables. */
function initialRange() {
  const requested = new URLSearchParams(location.search).get("range");
  if (requested && RANGES.some((r) => r.key === requested)) return requested;
  return localStorage.getItem("tempi.range") || "24h";
}

const state = {
  range: initialRange(),
  hidden: new Set(JSON.parse(localStorage.getItem("tempi.hidden") || "[]")),
  series: [],
  window: { from: 0, to: 0 },
  bucket: 0,
  colors: new Map(),
  hover: null,
};

const $ = (id) => document.getElementById(id);
const svgNS = "http://www.w3.org/2000/svg";

function colorFor(address) {
  if (!state.colors.has(address)) {
    state.colors.set(address, PALETTE[state.colors.size % PALETTE.length]);
  }
  return state.colors.get(address);
}

function nameFor(s) { return s.label || s.address; }

/**
 * Le DS18B20 est donné à ±0,5 °C par sa fiche technique. Sa résolution de
 * 0,0625 °C ne compense pas cette incertitude : afficher le centième afficherait
 * du bruit avec l'apparence d'une mesure. Les valeurs brutes restent entières
 * dans la base, dans l'API et dans l'export CSV.
 */
const DECIMALS = 1;

function fmtDeg(v) { return v == null ? "—" : v.toFixed(DECIMALS); }

function fmtTemp(v) { return v == null ? "—" : fmtDeg(v) + " °C"; }

function fmtAge(seconds) {
  if (seconds == null) return "jamais";
  if (seconds < 60) return "il y a " + Math.round(seconds) + " s";
  if (seconds < 3600) return "il y a " + Math.round(seconds / 60) + " min";
  if (seconds < 86400) return "il y a " + Math.round(seconds / 3600) + " h";
  return "il y a " + Math.round(seconds / 86400) + " j";
}

function fmtTick(ts, span) {
  const d = new Date(ts * 1000);
  const pad = (n) => String(n).padStart(2, "0");
  if (span <= 2 * 86400) return pad(d.getHours()) + ":" + pad(d.getMinutes());
  return pad(d.getDate()) + "/" + pad(d.getMonth() + 1);
}

function fmtFull(ts) {
  return new Date(ts * 1000).toLocaleString("fr-FR", {
    day: "2-digit", month: "2-digit", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  });
}

/** Bornes « rondes » pour l'axe des ordonnées. */
function niceScale(lo, hi, count) {
  if (!isFinite(lo) || !isFinite(hi)) return { lo: 0, hi: 1, step: 1 };
  if (hi - lo < 0.5) { const mid = (lo + hi) / 2; lo = mid - 0.5; hi = mid + 0.5; }
  const rough = (hi - lo) / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= rough) || mag * 10;
  return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step };
}

function timeTicks(from, to, count) {
  const steps = [60, 300, 900, 1800, 3600, 7200, 21600, 43200, 86400, 172800, 604800, 2592000];
  const span = to - from;
  const step = steps.find((s) => span / s <= count) || steps[steps.length - 1];
  const ticks = [];
  // Aligner sur le fuseau local pour que « minuit » tombe bien à minuit.
  const offset = new Date().getTimezoneOffset() * 60;
  for (let t = Math.ceil((from - offset) / step) * step + offset; t <= to; t += step) ticks.push(t);
  return ticks;
}

// -- rendu ------------------------------------------------------------------

function visibleSeries() {
  return state.series.filter((s) => !state.hidden.has(s.address) && s.points.length);
}

function drawChart() {
  const svg = $("chart");
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  const width = svg.clientWidth || 800;
  const height = svg.clientHeight || 380;
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  const shown = visibleSeries();
  if (!shown.length) {
    const text = document.createElementNS(svgNS, "text");
    text.setAttribute("x", width / 2);
    text.setAttribute("y", height / 2);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("class", "empty-note");
    text.textContent = "Aucune mesure sur cette période";
    svg.appendChild(text);
    return;
  }

  // Au-delà de quatre courbes, les étiquettes de bout se marchent dessus quelle
  // que soit la stratégie de répartition : la légende reprend seule ce rôle.
  const labelled = shown.length <= 4;
  const margin = { top: 14, right: labelled ? 76 : 16, bottom: 24, left: 44 };
  const plotW = Math.max(10, width - margin.left - margin.right);
  const plotH = Math.max(10, height - margin.top - margin.bottom);

  let lo = Infinity, hi = -Infinity;
  for (const s of shown) {
    for (const p of s.points) {
      if (p.min < lo) lo = p.min;
      if (p.max > hi) hi = p.max;
    }
  }
  const scale = niceScale(lo, hi, 5);
  const t0 = state.window.from, t1 = Math.max(state.window.to, t0 + 1);

  const x = (ts) => margin.left + ((ts - t0) / (t1 - t0)) * plotW;
  const y = (c) => margin.top + plotH - ((c - scale.lo) / (scale.hi - scale.lo)) * plotH;

  const add = (tag, attrs, cls, parent) => {
    const el = document.createElementNS(svgNS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    if (cls) el.setAttribute("class", cls);
    (parent || svg).appendChild(el);
    return el;
  };

  /* Le halo épaissit optiquement les tracés sans élargir le trait : la courbe
     reste fine — donc précise à lire — tout en restant visible à quelques
     mètres, sur l'écran accroché près du Raspberry Pi. */
  const defs = add("defs", {});
  const glow = add("filter", {
    id: "halo", x: "-20%", y: "-20%", width: "140%", height: "140%",
  }, null, defs);
  add("feGaussianBlur", { stdDeviation: 3, result: "flou" }, null, glow);
  const merge = add("feMerge", {}, null, glow);
  add("feMergeNode", { in: "flou" }, null, merge);
  add("feMergeNode", { in: "SourceGraphic" }, null, merge);

  /* Seules les horizontales sont tracées : ce sont elles qui portent la lecture
     des degrés. Un quadrillage vertical ajouterait un réseau de traits qui
     concurrence les courbes sans rien apprendre — les étiquettes de temps
     suffisent à situer un point dans la fenêtre. */
  for (let c = scale.lo; c <= scale.hi + 1e-9; c += scale.step) {
    const yy = y(c);
    add("line", { x1: margin.left, y1: yy, x2: margin.left + plotW, y2: yy }, "gridline");
    const label = add("text", { x: margin.left - 8, y: yy + 3.5, "text-anchor": "end" }, "axis");
    label.textContent = (Math.round(c * 10) / 10).toFixed(1);
  }
  add("line", {
    x1: margin.left, y1: margin.top + plotH,
    x2: margin.left + plotW, y2: margin.top + plotH,
  }, "baseline");

  // Axe des abscisses
  for (const ts of timeTicks(t0, t1, Math.max(2, Math.floor(plotW / 90)))) {
    const label = add("text", { x: x(ts), y: height - 7, "text-anchor": "middle" }, "axis");
    label.textContent = fmtTick(ts, t1 - t0);
  }

  // Les courbes partagent un seul groupe filtré : appliquer le halo à chaque
  // tracé séparément multiplierait les passes de flou sans rien changer au rendu.
  const traces = add("g", { filter: "url(#halo)" });
  const endLabels = [];

  for (const s of shown) {
    const color = colorFor(s.address);
    const runs = runsOf(s.points, gapFor(s.points));

    if (state.bucket > 0 && s.points.some((p) => p.samples > 1)) {
      let d = "";
      for (const run of runs) {
        const xs = run.map((p) => x(p.ts));
        d += curvePath(xs, run.map((p) => y(p.max))) + " " +
             curvePath([...xs].reverse(), run.map((p) => y(p.min)).reverse()).replace(/^M/, "L") +
             " Z";
      }
      add("path", { d, fill: color, "fill-opacity": .16, stroke: "none" });
    }

    for (const run of runs) {
      add("path", {
        d: curvePath(run.map((p) => x(p.ts)), run.map((p) => y(p.celsius))),
        fill: "none", stroke: color, "stroke-width": 2.2,
        "stroke-linejoin": "round", "stroke-linecap": "round",
      }, null, traces);
    }

    const last = s.points[s.points.length - 1];
    add("circle", { cx: x(last.ts), cy: y(last.celsius), r: 3.4, fill: color }, "endpoint");
    if (labelled) {
      endLabels.push({ y: y(last.celsius), color, name: nameFor(s), celsius: last.celsius });
    }
  }

  /* Étiquette de bout : le nom et la valeur se lisent au bout de la courbe, sans
     aller-retour vers la légende. Le texte porte l'encre de l'interface et non
     la couleur du capteur — c'est la pastille qui identifie, et un nom écrit en
     couleur de série perdrait en lisibilité sur le fond profond. */
  for (const label of spreadLabels(endLabels, margin.top, margin.top + plotH)) {
    const lx = margin.left + plotW + 10;
    add("rect", { x: lx, y: label.y - 10, width: 7, height: 7, rx: 2, fill: label.color });
    add("text", { x: lx + 11, y: label.y - 4 }, "axis").textContent = ellipsis(label.name, 9);
    add("text", { x: lx + 11, y: label.y + 10 }, "axis axis-value").textContent =
      fmtTemp(label.celsius);
  }

  // Curseur de survol
  if (state.hover != null) {
    const xx = x(state.hover);
    if (xx >= margin.left && xx <= margin.left + plotW) {
      add("line", {
        x1: xx, y1: margin.top, x2: xx, y2: margin.top + plotH,
      }, "cursor");
      for (const s of shown) {
        const p = nearestPoint(s, state.hover);
        if (p) {
          add("circle", {
            cx: x(p.ts), cy: y(p.celsius), r: 4, fill: colorFor(s.address),
          }, "endpoint");
        }
      }
    }
  }

  svg._scales = { x, margin, plotW, t0, t1 };
}

/**
 * Écart au-delà duquel on interrompt le tracé plutôt que de relier deux points :
 * la collecte s'est arrêtée sur cet intervalle.
 *
 * Le seuil se déduit de l'espacement réel des points, pas de la tranche
 * d'agrégation. Sur une plage courte, la tranche vaut quelques secondes alors
 * que les relevés sont espacés d'une minute : un seuil calculé sur la tranche
 * couperait chaque segment et le graphique resterait vide.
 */
function gapFor(points) {
  if (points.length < 3) return Infinity;
  const deltas = [];
  for (let i = 1; i < points.length; i++) deltas.push(points[i].ts - points[i - 1].ts);
  deltas.sort((a, b) => a - b);
  const median = deltas[Math.floor(deltas.length / 2)];
  return Math.max(median * 3, state.bucket * 3, 1);
}

/** Découpe une série en segments continus : au-delà de `gap`, on ne relie pas. */
function runsOf(points, gap) {
  const runs = [];
  let run = [];
  for (let i = 0; i < points.length; i++) {
    if (i > 0 && points[i].ts - points[i - 1].ts > gap && run.length) {
      runs.push(run);
      run = [];
    }
    run.push(points[i]);
  }
  if (run.length) runs.push(run);
  return runs;
}

/**
 * Tracé lissé passant par tous les points, en cubiques de Fritsch–Carlson.
 *
 * Le choix de cette famille de tangentes n'est pas cosmétique : une spline
 * cardinale ordinaire dépasse les valeurs voisines dans les virages et
 * inventerait des pics de température qui n'ont jamais été relevés. Celle-ci est
 * monotone par construction — entre deux mesures, la courbe reste bornée par
 * elles.
 */
function curvePath(xs, ys) {
  const n = xs.length;
  if (!n) return "";
  if (n === 1) return `M ${xs[0]} ${ys[0]}`;

  const slopes = [];
  for (let i = 0; i < n - 1; i++) {
    const dx = xs[i + 1] - xs[i];
    slopes.push(dx === 0 ? 0 : (ys[i + 1] - ys[i]) / dx);
  }

  const tangents = new Array(n);
  tangents[0] = slopes[0];
  tangents[n - 1] = slopes[n - 2];
  for (let i = 1; i < n - 1; i++) {
    // Un changement de sens est un extremum local : y imposer une tangente nulle
    // est ce qui empêche la courbe de déborder au-delà du point mesuré.
    tangents[i] = slopes[i - 1] * slopes[i] <= 0 ? 0 : (slopes[i - 1] + slopes[i]) / 2;
  }
  for (let i = 0; i < n - 1; i++) {
    if (slopes[i] === 0) { tangents[i] = 0; tangents[i + 1] = 0; continue; }
    const a = tangents[i] / slopes[i], b = tangents[i + 1] / slopes[i];
    const norm = Math.hypot(a, b);
    if (norm > 3) {
      tangents[i] = (3 / norm) * a * slopes[i];
      tangents[i + 1] = (3 / norm) * b * slopes[i];
    }
  }

  let d = `M ${xs[0]} ${ys[0]}`;
  for (let i = 0; i < n - 1; i++) {
    const dx = (xs[i + 1] - xs[i]) / 3;
    d += ` C ${xs[i] + dx} ${ys[i] + tangents[i] * dx}` +
         ` ${xs[i + 1] - dx} ${ys[i + 1] - tangents[i + 1] * dx}` +
         ` ${xs[i + 1]} ${ys[i + 1]}`;
  }
  return d;
}

/**
 * Écarte les étiquettes de bout qui se superposeraient : deux capteurs à la même
 * température finissent à la même hauteur. On descend celles qui se touchent,
 * puis on remonte le paquet entier s'il déborde du cadre.
 */
function spreadLabels(labels, top, bottom) {
  const MIN = 26;
  const sorted = [...labels].sort((a, b) => a.y - b.y);
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i].y - sorted[i - 1].y < MIN) sorted[i].y = sorted[i - 1].y + MIN;
  }
  const overflow = sorted.length ? sorted[sorted.length - 1].y - (bottom - 2) : 0;
  if (overflow > 0) {
    for (const label of sorted) label.y = Math.max(top + 10, label.y - overflow);
  }
  return sorted;
}

function ellipsis(value, max) {
  return value.length <= max ? value : value.slice(0, max - 1) + "…";
}

function nearestPoint(series, ts) {
  if (!series.points.length) return null;
  let best = null, bestDist = Infinity;
  for (const p of series.points) {
    const dist = Math.abs(p.ts - ts);
    if (dist < bestDist) { bestDist = dist; best = p; }
  }
  const tolerance = Math.max(state.bucket * 2, (state.window.to - state.window.from) / 60);
  return bestDist <= tolerance ? best : null;
}

function renderCards(latest, now) {
  const cards = $("cards");
  cards.innerHTML = "";
  for (const s of latest) {
    const div = document.createElement("div");
    div.className = "card";
    const age = s.ts == null ? null : now - s.ts;
    if (age == null || age > 300) div.classList.add("stale");
    div.style.setProperty("--dot", colorFor(s.address));
    div.innerHTML =
      `<div class="name" title="${s.address} — cliquer pour renommer">${escapeHtml(nameFor(s))}</div>` +
      `<div class="value">${fmtTemp(s.celsius)}</div>` +
      `<div class="age">${fmtAge(age)}</div>`;
    div.querySelector(".name").addEventListener("click", () => renameSensor(s));
    cards.appendChild(div);
  }
}

function renderLegend() {
  const legend = $("legend");
  legend.innerHTML = "";
  for (const s of state.series) {
    const on = !state.hidden.has(s.address);
    const button = document.createElement("button");
    button.setAttribute("aria-pressed", String(on));
    button.innerHTML = `<span class="swatch" style="background:${colorFor(s.address)}"></span>` +
                       `<span>${escapeHtml(nameFor(s))}</span>`;
    button.addEventListener("click", () => {
      if (on) state.hidden.add(s.address); else state.hidden.delete(s.address);
      localStorage.setItem("tempi.hidden", JSON.stringify([...state.hidden]));
      renderLegend();
      drawChart();
      loadSummary();
    });
    legend.appendChild(button);
  }
}

function renderSummary(summary) {
  const body = $("summary");
  body.innerHTML = "";
  const entries = Object.entries(summary).filter(([address]) => !state.hidden.has(address));
  if (!entries.length) {
    body.innerHTML = '<tr><td colspan="6" class="empty">Aucune donnée sur cette période</td></tr>';
    return;
  }
  const labels = new Map(state.series.map((s) => [s.address, nameFor(s)]));
  for (const [address, stats] of entries) {
    const row = document.createElement("tr");
    row.innerHTML =
      `<td>${escapeHtml(labels.get(address) || address)}</td>` +
      `<td>${fmtDeg(stats.min)}</td><td>${fmtDeg(stats.avg)}</td><td>${fmtDeg(stats.max)}</td>` +
      `<td>${fmtDeg(stats.max - stats.min)}</td><td>${stats.samples}</td>`;
    body.appendChild(row);
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// -- données ----------------------------------------------------------------

async function fetchJson(url) {
  const response = await fetch(url, { headers: { Accept: "application/json" } });
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    throw new Error(detail.error || `HTTP ${response.status}`);
  }
  return response.json();
}

async function loadSeries() {
  const data = await fetchJson(`api/series?range=${encodeURIComponent(state.range)}`);
  state.series = data.series;
  state.window = { from: data.from, to: data.to };
  state.bucket = data.bucket;
  for (const s of state.series) colorFor(s.address);
  $("csv").href = `api/export.csv?range=${encodeURIComponent(state.range)}`;
  renderLegend();
  drawChart();
}

async function loadSummary() {
  const data = await fetchJson(`api/summary?range=${encodeURIComponent(state.range)}`);
  renderSummary(data.summary);
}

async function loadLatest() {
  const data = await fetchJson("api/latest");
  renderCards(data.sensors, data.now);
}

async function refresh() {
  const status = $("status");
  try {
    // Le tableau récapitulatif reprend les noms des séries : il doit donc être
    // rendu après elles, sans quoi il retomberait sur les adresses brutes.
    await Promise.all([loadLatest(), loadSeries().then(loadSummary)]);
    status.classList.remove("error");
    const points = state.series.reduce((n, s) => n + s.points.length, 0);
    const step = state.bucket ? `, moyennes sur ${humanBucket(state.bucket)}` : "";
    status.textContent = `${points} point(s)${step} — mis à jour à ${new Date().toLocaleTimeString("fr-FR")}`;
  } catch (error) {
    status.classList.add("error");
    status.textContent = "erreur : " + error.message;
  }
}

function humanBucket(seconds) {
  if (seconds < 60) return seconds + " s";
  if (seconds < 3600) return Math.round(seconds / 60) + " min";
  if (seconds < 86400) return Math.round(seconds / 3600) + " h";
  return Math.round(seconds / 86400) + " j";
}

async function renameSensor(sensor) {
  const label = prompt(`Nom du capteur ${sensor.address} :`, sensor.label || "");
  if (label === null) return;
  try {
    await fetch(`api/sensors/${encodeURIComponent(sensor.address)}/label`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label }),
    });
    await refresh();
  } catch (error) {
    alert("Renommage impossible : " + error.message);
  }
}

// -- interactions -----------------------------------------------------------

function buildRanges() {
  const container = $("ranges");
  for (const range of RANGES) {
    const button = document.createElement("button");
    button.textContent = range.label;
    button.setAttribute("aria-pressed", String(range.key === state.range));
    button.addEventListener("click", () => {
      state.range = range.key;
      localStorage.setItem("tempi.range", range.key);
      history.replaceState(null, "", "?range=" + range.key);
      for (const other of container.children) {
        other.setAttribute("aria-pressed", String(other === button));
      }
      refresh();
    });
    container.appendChild(button);
  }
}

function setupHover() {
  const svg = $("chart");
  const tip = $("tip");

  const move = (event) => {
    const scales = svg._scales;
    if (!scales) return;
    const rect = svg.getBoundingClientRect();
    const px = event.clientX - rect.left;
    const ratio = (px - scales.margin.left) / scales.plotW;
    if (ratio < 0 || ratio > 1) return hide();

    state.hover = scales.t0 + ratio * (scales.t1 - scales.t0);
    drawChart();

    const rows = [];
    for (const s of visibleSeries()) {
      const point = nearestPoint(s, state.hover);
      if (!point) continue;
      const extra = point.samples > 1 ? ` <span style="opacity:.6">(${fmtDeg(point.min)} – ${fmtDeg(point.max)})</span>` : "";
      rows.push(`<div class="row"><span class="swatch" style="background:${colorFor(s.address)}"></span>` +
                `<span>${escapeHtml(nameFor(s))}</span><b>${fmtTemp(point.celsius)}</b>${extra}</div>`);
    }
    if (!rows.length) return hide();

    tip.innerHTML = `<div class="t">${fmtFull(Math.round(state.hover))}</div>` + rows.join("");
    tip.style.opacity = "1";
    const width = tip.offsetWidth;
    tip.style.left = Math.min(event.clientX + 14, window.innerWidth - width - 8) + "px";
    tip.style.top = Math.min(event.clientY + 14, window.innerHeight - tip.offsetHeight - 8) + "px";
  };

  const hide = () => {
    if (state.hover !== null) { state.hover = null; drawChart(); }
    tip.style.opacity = "0";
  };

  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerleave", hide);
}

buildRanges();
setupHover();
$("refresh").addEventListener("click", refresh);
new ResizeObserver(() => drawChart()).observe($("chart"));
refresh();
setInterval(refresh, 30000);
</script>
</body>
