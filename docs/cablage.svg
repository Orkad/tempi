<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="Schéma de câblage du DS18B20 sur le Raspberry Pi : broche 1 (3,3 V) vers VDD, broche 7 (GPIO 4) vers DQ, broche 6 (GND) vers GND, et résistance de tirage de 4,7 kilo-ohms entre DQ et 3,3 V.">

  <rect x="1" y="1" width="758" height="498" rx="14" fill="#fdfdfd" stroke="#dfe3e8" stroke-width="2"/>

  <text x="62" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#1b1f24">Raspberry Pi</text>
  <text x="600" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#1b1f24">DS18B20</text>

  <!-- Connecteur GPIO -->
  <rect x="62" y="70" width="86" height="250" rx="6" fill="#2e3440"/>
  <rect x="148" y="103" width="14" height="14" fill="#e0b64a"/>
  <rect x="148" y="193" width="14" height="14" fill="#e0b64a"/>
  <rect x="148" y="283" width="14" height="14" fill="#e0b64a"/>

  <!-- Fils -->
  <line x1="162" y1="110" x2="560" y2="110" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="162" y1="200" x2="560" y2="200" stroke="#b07d00" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="162" y1="290" x2="560" y2="290" stroke="#2f343a" stroke-width="3.5" stroke-linecap="round"/>

  <text x="176" y="99" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#c0392b">Broche 1 — 3,3 V</text>
  <text x="176" y="189" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#b07d00">Broche 7 — GPIO 4</text>
  <text x="176" y="279" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#2f343a">Broche 6 — GND</text>

  <!-- Résistance de tirage, entre la ligne de données et le 3,3 V -->
  <line x1="430" y1="110" x2="430" y2="136" stroke="#c0392b" stroke-width="3"/>
  <line x1="430" y1="184" x2="430" y2="200" stroke="#b07d00" stroke-width="3"/>
  <rect x="416" y="136" width="28" height="48" rx="3" fill="#ffffff" stroke="#1b1f24" stroke-width="2"/>
  <circle cx="430" cy="110" r="5" fill="#c0392b"/>
  <circle cx="430" cy="200" r="5" fill="#b07d00"/>
  <text x="456" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f24">4,7 kΩ</text>
  <text x="456" y="183" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#616a75">indispensable</text>

  <!-- Capteur -->
  <line x1="560" y1="110" x2="600" y2="110" stroke="#9aa1ab" stroke-width="4"/>
  <line x1="560" y1="200" x2="600" y2="200" stroke="#9aa1ab" stroke-width="4"/>
  <line x1="560" y1="290" x2="600" y2="290" stroke="#9aa1ab" stroke-width="4"/>
  <rect x="600" y="80" width="100" height="240" rx="10" fill="#d8dbe0" stroke="#9aa1ab" stroke-width="2"/>
  <text x="616" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f24">VDD</text>
  <text x="616" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f24">DQ</text>
  <text x="616" y="295" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f24">GND</text>

  <line x1="62" y1="355" x2="698" y2="355" stroke="#e3e6ea" stroke-width="2"/>

  <!-- Repérage des pattes -->
  <text x="62" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#1b1f24">Repérer les pattes</text>

  <path d="M 86 438 L 86 418 A 52 24 0 0 1 190 418 L 190 438 Z" fill="#d8dbe0" stroke="#9aa1ab" stroke-width="2"/>
  <line x1="100" y1="438" x2="100" y2="456" stroke="#9aa1ab" stroke-width="3"/>
  <line x1="138" y1="438" x2="138" y2="456" stroke="#9aa1ab" stroke-width="3"/>
  <line x1="176" y1="438" x2="176" y2="456" stroke="#9aa1ab" stroke-width="3"/>
  <text x="100" y="473" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#2f343a">GND</text>
  <text x="138" y="473" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#b07d00">DQ</text>
  <text x="176" y="473" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#c0392b">VDD</text>

  <text x="230" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#1b1f24">Composant nu : méplat tourné vers vous, pattes vers le bas,</text>
  <text x="230" y="432" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#1b1f24">de gauche à droite GND, DQ, VDD.</text>
  <text x="230" y="458" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#616a75">Sonde étanche : noir = GND, jaune ou blanc = DQ, rouge = VDD.</text>

</svg>
