<text x="436" y="326" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#1b1f24">DS18B20</text>
<text x="30" y="522" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#1b1f24">Chaque colonne de 5 trous est reliée en interne. Les deux moitiés sont séparées par le canal central.</text>
<text x="30" y="546" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#c0392b">La résistance relie la colonne 6 (DQ) à la colonne 7 (3,3 V) — jamais à la colonne 5 (GND).</text>
<text x="30" y="570" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#1b1f24">Cette mini-platine n'a pas de rails d'alimentation : le fil rouge n'alimente que la colonne 7.</text>
<text x="30" y="594" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#1b1f24">Capteur : méplat tourné vers vous — GND à gauche (5), DQ au centre (6), VDD à droite (7).</text>
</svg>
