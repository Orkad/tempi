name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurer
        run: dotnet restore src/Tempi.slnx

      - name: Compiler
        run: dotnet build src/Tempi.slnx --no-restore --configuration Release

      # Le SDK 10 a retiré VSTest : le runner est choisi dans global.json et le
      # fichier de solution se passe par --solution.
      - name: Tester
        run: dotnet test --solution src/Tempi.slnx --configuration Release --no-build

      # La compilation croisée vers arm64 est la cible réelle du projet. La vérifier
      # à chaque commit évite de découvrir un problème de trimming au moment de
      # publier une release.
      - name: Vérifier la publication arm64
        run: |
          dotnet publish src/Tempi/Tempi.csproj \
            --configuration Release \
            --runtime linux-arm64 \
            --self-contained \
            -p:PublishTrimmed=true \
            --output "$RUNNER_TEMP/arm64"
          ls -la "$RUNNER_TEMP/arm64/tempi"

  scripts:
    name: Scripts de déploiement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Les scripts d'installation ne s'exécutent nulle part en intégration
      # continue : ils demandent systemd, du matériel 1-Wire et une release à
      # télécharger. L'analyse statique est le seul filet qui reste.
      - name: Analyse statique
        run: shellcheck -x -s bash --severity=warning scripts/*.sh

  golden:
    name: Golden master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Les fichiers de tests/golden/expected/ ont été produits par l'implémentation
      # Python d'origine. Les rejouer vérifie qu'aucun changement n'a déplacé un
      # octet de l'API ou de la ligne de commande.
      # Publication non trimmée : cette étape répond à « le comportement est-il
      # intact ? »,
      # pas à « le trimming tient-il ? ». Les deux questions méritent une réponse,
      # mais les confondre empêche de savoir laquelle a échoué. La seconde est
      # traitée par l'étape « Démarrage du binaire trimmé » ci-dessous.
      - name: Publier le binaire .NET
        run: |
          dotnet publish src/Tempi/Tempi.csproj \
            --configuration Release \
            -p:PublishTrimmed=false \
            -p:SelfContained=false \
            --output "$RUNNER_TEMP/dotnet"

      - name: Capturer le comportement
        run: TEMPI_CMD="$(command -v dotnet) $RUNNER_TEMP/dotnet/tempi.dll" ./scripts/golden-capture.sh

      # Les deux corpus : les réponses HTTP et les sorties de la ligne de commande,
      # codes de retour compris. Le dossier machine/ en est exclu — « doctor »
      # interroge l'hôte, sa sortie n'a de sens qu'entre deux exécutions locales.
      - name: Comparer à la référence
        run: |
          diff -r tests/golden/expected/api tests/golden/actual/api
          diff -r tests/golden/expected/cli tests/golden/actual/cli

      # Le trimming ne casse rien à la compilation : il supprime du code que
      # personne ne référence statiquement, et l'absence ne se découvre qu'à
      # l'exécution. Kestrel cherche un certificat par défaut au démarrage, même en
      # HTTP pur, et ce chemin passe par X509Certificate2Collection.
      #
      # Construire ne suffit pas : il faut démarrer le binaire et l'interroger.
      # C'est ainsi que la suppression de X509Certificate2Collection.GetEnumerator a
      # été découverte, et c'est ce qui empêchera la prochaine de passer inaperçue.
      - name: Démarrage du binaire trimmé
        run: |
          dotnet publish src/Tempi/Tempi.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            -p:PublishTrimmed=true \
            --output "$RUNNER_TEMP/trimme"
          TEMPI_DB=":memory:" TEMPI_PORT=18499 "$RUNNER_TEMP/trimme/tempi" serve &
          sleep 5
          curl -sf --max-time 5 http://127.0.0.1:18499/api/health > /dev/null
