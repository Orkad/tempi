name: Release

# Filet manuel : un tag `v*` posé à la main (par exemple pour republier un artefact
# sur un commit précis) publie exactement comme continuous-release.yml, qui pose ce
# même genre de tag automatiquement à chaque push sur main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ github.ref_name }}
