name: Continuous Release

# Publie automatiquement une release à chaque push sur main : voir la section
# « Version » du README et la remarque XML doc de TempiVersion.cs pour la règle de
# calcul du numéro de version (incrément de patch par défaut, ou bump manuel
# respecté s'il a déjà eu lieu dans le push).
#
# Les commits et le tag que ce workflow pousse utilisent le jeton par défaut
# GITHUB_TOKEN, que GitHub Actions ne fait volontairement pas redéclencher
# d'autres workflows — sans quoi ce push retaguerait indéfiniment. C'est aussi
# pourquoi ce job revalide lui-même le bump (build, tests) avant de committer :
# ci.yml ne le fera pas pour lui.

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  bump:
    name: Déterminer et poser la version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Décider de la prochaine version
        id: decide
        run: |
          declared=$(grep -oP 'Value = "\K[^"]+' src/Tempi/TempiVersion.cs)
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          latest="${latest_tag#v}"

          if [ -n "$latest" ] && [ "$declared" = "$latest" ]; then
            # Personne n'a monté TempiVersion.Value dans ce push : incrémente le patch.
            IFS=. read -r major minor patch <<< "$declared"
            next="$major.$minor.$((patch + 1))"
          else
            # TempiVersion.Value a déjà été monté à la main (MINOR ou MAJOR) : on le respecte.
            next="$declared"
          fi

          echo "declared=$declared" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "$next" != "$declared" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Monter la version (incrément de patch)
        if: steps.decide.outputs.changed == 'true'
        run: |
          declared="${{ steps.decide.outputs.declared }}"
          next="${{ steps.decide.outputs.next }}"
          escaped=$(printf '%s' "$declared" | sed 's/\./\\./g')

          sed -i "s/$escaped/$next/" src/Tempi/TempiVersion.cs
          sed -i "s/$escaped/$next/" Directory.Build.props

      # Revalide le bump (ou, si rien n'a changé ici, le commit humain qui a déjà
      # monté la version) juste avant de publier — ci.yml ne rejouera pas ce
      # contrôle sur le commit que ce job s'apprête à committer et taguer.
      - name: Valider avant publication
        run: |
          dotnet build src/Tempi.slnx --configuration Release
          dotnet test --solution src/Tempi.slnx --configuration Release --no-build

      - name: Committer et taguer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ steps.decide.outputs.changed }}" = "true" ]; then
            git commit -am "Version ${{ steps.decide.outputs.next }}"
            git push origin HEAD:main
          fi

          tag="v${{ steps.decide.outputs.next }}"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

  publish:
    name: Publier la release
    needs: bump
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: v${{ needs.bump.outputs.version }}
